    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="var(--color-background)" />

  <g id="header-pairing" text-anchor="middle">
    <text x="600" y="56" class="font-editorial header-line">
      <tspan class="header-accent-rank">Ranking</tspan> asks: how valuable? <tspan class="header-accent-vis">Visibility</tspan> asks: what's allowed?
    </text>
  </g>

