<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
  role="img" aria-labelledby="d4-title d4-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="d4-title">Diagram 4 — Ranking vs. Visibility Filtering</title>
  <desc id="d4-desc">
    A high-scoring post makes the Top K (the highest-scoring candidates; 50
    in checked-in defaults), then passes through Visibility Filtering, a
    separate policy gate that runs after ranking is finished, per viewer and
    per post. The gate produces one of three outcomes: Allow (the post can
    continue toward the feed), Interstitial (the post may still be
    delivered, with some form of warning or restricted treatment), or Drop
    (the post is removed and never reaches the client, regardless of score).
    Which policy applies depends on the post's relationship to the viewer.
    TimelineHomeRecommendations, used for recommendation/OON contexts,
    includes a broader set of drop rules than TimelineHome; both policies
    can produce all three outcomes. A separate, earlier mechanism can also
    exclude a post from the retrieval corpus entirely, before any viewer's
    request, independent of this per-request check.
  </desc>

