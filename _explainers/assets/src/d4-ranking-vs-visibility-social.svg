<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675"
  role="img" aria-labelledby="d4s-title d4s-desc" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <title id="d4s-title">A high ranking score does not guarantee a post is shown</title>
  <desc id="d4s-desc">
    A high-scoring post reaches Visibility Filtering, a separate policy gate
    that runs after ranking. It produces one of three outcomes: Allow (can
    continue), Interstitial (still delivered, with a warning), or Drop
    (removed, regardless of score).
  </desc>

