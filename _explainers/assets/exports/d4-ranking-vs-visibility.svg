    .arrow-policy { stroke: var(--outcome-policy); stroke-width: 2.5; fill: none; marker-end: url(#arrow-policy-head); }
    .arrow-dotted { stroke: var(--color-ink-muted); stroke-width: 1.4; fill: none; stroke-dasharray: 1 4; stroke-linecap: round; }

