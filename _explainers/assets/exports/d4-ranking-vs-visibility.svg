  </style>

  <defs>
    <marker id="arrow-primary-head" viewBox="0 0 12 12" refX="9.5" refY="6"
      markerWidth="8.5" markerHeight="8.5" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="var(--color-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
