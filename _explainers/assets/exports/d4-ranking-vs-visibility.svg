    </g>
  </g>

  <!-- secondary layer: IN/OON policy comparison -->
  <g id="secondary-policy-layer" text-anchor="middle">
    <text x="800" y="720" class="font-editorial framing-line">Which policy applies depends on the post's network status relative to the viewer:</text>

    <g id="timeline-home-card">
      <rect class="policy-card" x="430" y="734" width="350" height="82" rx="8" />
      <text x="605" y="760" class="font-technical policy-title">TimelineHome</text>
      <text x="605" y="780" class="font-editorial policy-subtitle">In-network policy</text>
      <text x="605" y="797" class="font-editorial policy-detail ink-muted">Mainly account-state issues, blocks/mutes,</text>
      <text x="605" y="810" class="font-editorial policy-detail ink-muted">legal takedowns, hard NSFW cases</text>
    </g>

    <g id="timeline-home-recommendations-card">
      <rect class="policy-card" x="820" y="734" width="350" height="82" rx="8" />
      <text x="995" y="760" class="font-technical policy-title" font-size="13.5">TimelineHomeRecommendations</text>
      <text x="995" y="780" class="font-editorial policy-subtitle">Recommendation/OON policy — broader</text>
      <text x="995" y="797" class="font-editorial policy-detail ink-muted">Everything TimelineHome checks, plus</text>
      <text x="995" y="810" class="font-editorial policy-detail ink-muted">~2 dozen additional drop rules</text>
    </g>

    <text x="800" y="833" class="font-editorial framing-line">Recommendation/OON policy covers more drop cases — not a claim that OON content is unsafe.</text>
  </g>

  <!-- index-time safety note: a separate, earlier mechanism, deliberately not part of the fork -->
  <g id="index-time-note">
    <rect class="side-note-box" x="1230" y="168" width="330" height="122" rx="8" />
    <text x="1250" y="190" class="font-technical side-note-badge">SEPARATE MECHANISM</text>
    <text x="1250" y="210" class="font-editorial side-note-text">Some posts can be excluded before</text>
    <text x="1250" y="224" class="font-editorial side-note-text">request-time ranking even begins,</text>
    <text x="1250" y="238" class="font-editorial side-note-text">through Phoenix's index-admission /</text>
    <text x="1250" y="252" class="font-editorial side-note-text">index-time safety check.</text>
    <text x="1250" y="272" class="font-editorial side-note-text">— see Diagrams 02, 05</text>
    <path class="arrow-dotted" d="M1230,195 C1110,180 920,172 800,172" />
  </g>

  <!-- provenance -->
  <g id="provenance-footer" text-anchor="middle">
