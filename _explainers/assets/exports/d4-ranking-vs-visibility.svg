    tools/sync-svg-styles.py from the canonical ../field-atlas.css — do not
    hand-edit its contents; edit field-atlas.css and re-run the sync script.
    Light mode (default — no theme class on the root <svg>): this file is
    the desktop-light canonical variant.
  -->
  <style id="field-atlas-shared">
    /* BEGIN GENERATED FIELD ATLAS CSS — DO NOT EDIT BY HAND */
    /*
