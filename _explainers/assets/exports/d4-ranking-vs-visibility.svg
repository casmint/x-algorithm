      --role-4-pill-fill: #9784c9;
      --role-4-pill-ink: #17140f;

      --role-5-stroke: #e2794a;

      --role-6-stroke: #c98fa0;

      --role-7-fill: #4a4d49;

      --role-10-fill: #b99a4a;
